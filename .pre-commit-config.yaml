repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
